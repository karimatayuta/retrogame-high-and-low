[project]
name = "twinjokers"
version = "0.1.0"
description = "FREE DEAL TWIN JOKERS (PROG) — a retro video poker with HIGH & LOW double down, built with Pyxel"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "pyxel>=2.9.9",
]

[project.scripts]
twinjokers = "twinjokers.__main__:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: exhaustive verification (run with: uv run pytest -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
